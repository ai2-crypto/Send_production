[project]
name = "gui-san-luong"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "trinhthanh20022@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "streamlit>=1.66.1",
]

[project.scripts]
gui-san-luong = "gui_san_luong:main"

[build-system]
